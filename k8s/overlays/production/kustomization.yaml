# Production: its own namespace, reachable at http://localhost:8082 (NodePort 30082).
# In this lab, staging and production share one cluster. Real companies usually give production its own cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: Service
      name: status-board
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
