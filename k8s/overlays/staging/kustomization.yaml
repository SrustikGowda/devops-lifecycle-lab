# Staging: its own namespace, reachable at http://localhost:8081 (NodePort 30081).
# See the result without changing anything:  kubectl kustomize k8s/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: Service
      name: status-board
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
