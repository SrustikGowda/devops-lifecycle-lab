# What SonarQube analyses, and where the test coverage report is.
sonar.projectKey=devops-lifecycle-lab
sonar.projectName=DevOps Lifecycle Lab
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
# pytest writes this file. SonarQube does not run your tests; it reads this report.
sonar.python.coverage.reportPaths=coverage.xml
# Wait for the quality gate and fail the scan if it fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
