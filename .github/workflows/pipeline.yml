# Pipeline: what happens after a pull request is merged into main.
#   checks -> image pushed to ghcr.io -> deploy to staging -> (you approve) -> deploy to production
# The deploy jobs run on YOUR self-hosted runner (label "lab"), because only it can reach your Kubernetes cluster
# (the kind cluster "lab" on your laptop, k8s/kind-config.yaml).
# They only run for the main branch, and only after you set the repository variable LAB_DEPLOY to "true"
# (Settings -> Secrets and variables -> Actions -> Variables), once your runner and environments are ready.
name: Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-main
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and push the image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the image name and version
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # registry names must be lowercase
          {
            echo "image=ghcr.io/${repo}:${GITHUB_SHA}"
            echo "latest=ghcr.io/${repo}:main"
            echo "version=$(cat VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub's container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for Intel and ARM servers, tag with the commit, push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}
            ${{ steps.names.outputs.latest }}
          build-args: |
            APP_VERSION=${{ steps.names.outputs.version }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

  staging:
    name: Deploy to staging
    needs: release
    if: github.ref == 'refs/heads/main' && vars.LAB_DEPLOY == 'true'
    runs-on: [self-hosted, lab]
    environment:
      name: staging
      url: http://localhost:8081
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy with kubectl
        run: bash runner/deploy-k8s.sh staging "$IMAGE" "$VERSION"
      - name: Smoke test from outside (is the new version answering?)
        run: |
          reply="$(curl -fsS http://localhost:8081/version)"
          echo "$reply"
          grep -qF "\"version\":\"$VERSION\"" <<<"$reply" || { echo "staging answered, but not with $VERSION" >&2; exit 1; }

  production:
    name: Deploy to production
    needs: [release, staging]
    if: github.ref == 'refs/heads/main' && vars.LAB_DEPLOY == 'true'
    runs-on: [self-hosted, lab]
    # This environment has "required reviewers": the job waits here until someone presses Approve.
    environment:
      name: production
      url: http://localhost:8082
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy with kubectl
        run: bash runner/deploy-k8s.sh production "$IMAGE" "$VERSION"
      - name: Smoke test from outside (is the new version answering?)
        run: |
          reply="$(curl -fsS http://localhost:8082/version)"
          echo "$reply"
          grep -qF "\"version\":\"$VERSION\"" <<<"$reply" || { echo "production answered, but not with $VERSION" >&2; exit 1; }
