# CI: the checks every change must pass before it can be merged.
# Runs on every pull request, and the Pipeline workflow re-runs it on main before releasing.
# Everything here runs on GitHub's machines, never on your own runner, so code from a pull request can't touch your laptop.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    # The job runs inside this Docker image: the same Python on every run, nothing left over from the last one.
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests with coverage (pytest)
        run: pytest
      - name: Keep the coverage report for SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  quality:
    name: Quality gate (SonarQube)
    needs: test
    runs-on: ubuntu-latest
    # A fresh SonarQube just for this run: free, no account, thrown away afterwards.
    services:
      sonarqube:
        image: sonarqube:26.11.0.134175-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the coverage report from the test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Set up SonarQube (quality gate "lab-gate", coverage >= 80%)
        run: |
          token=$(bash sonarqube/setup.sh)
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Scan and wait for the quality gate
        run: bash sonarqube/scan.sh

  image:
    name: Docker image builds and starts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --build-arg APP_VERSION="$(cat VERSION)" --build-arg GIT_SHA="$GITHUB_SHA" -t status-board:ci .
      - name: Smoke test (start it and ask /health)
        run: |
          docker run -d --name smoke -p 8080:8080 status-board:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then echo; echo "Healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs smoke
          echo "The container never answered on /health" >&2
          exit 1
