# Ansible settings for this lab. Ansible reads this file when you run it from the ansible/ folder,
# or from anywhere if you set:  export ANSIBLE_CONFIG=ansible/ansible.cfg   (from the repo root)

[defaults]
inventory = inventory.ini
# Collections live inside the repo (ansible/collections), not in your home folder.
collections_path = collections
roles_path = roles
# Readable output: results printed as YAML, skipped tasks hidden.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = false
# Host keys stay checked: Lima records each VM's key in ~/.lima/<name>/ssh.known_hosts (used via ssh.config),
# and writes a fresh one when a VM is recreated, so there is no "host key changed" error to switch off.
host_key_checking = true
interpreter_python = /usr/bin/python3
retry_files_enabled = false

[ssh_connection]
pipelining = true
