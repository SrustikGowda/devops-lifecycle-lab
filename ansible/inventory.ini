# The two lab servers (Lima VMs on this Mac). Create them with:  bash servers/up.sh
# Ansible reaches each VM through the SSH config Lima writes for it: ~/.lima/<name>/ssh.config
# app_port is the port the app gets on the VM, and on your Mac (http://localhost:<app_port>).

[staging]
lab-staging app_port=8081

[production]
lab-prod app_port=8082

[all:vars]
ansible_host=lima-{{ inventory_hostname }}
ansible_ssh_common_args=-F {{ lookup('env', 'LIMA_HOME') | default(lookup('env', 'HOME') ~ '/.lima', true) }}/{{ inventory_hostname }}/ssh.config
ansible_python_interpreter=/usr/bin/python3
